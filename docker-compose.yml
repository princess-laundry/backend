name: posture

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-posture}
      POSTGRES_USER: ${POSTGRES_USER:-posture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-posture}
      PGUSER: ${POSTGRES_USER:-posture}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/usr/local/bin/migrate.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/migrate.sh"]

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Prebuilt by .github/workflows/image.yml, so `docker compose pull` skips
    # the long C++ build. `docker compose build` still builds it locally.
    image: ghcr.io/princess-laundry/backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_THREADS: ${APP_THREADS:-0}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-posture}
      DB_USER: ${POSTGRES_USER:-posture}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_TTL_SEC: ${JWT_TTL_SEC:-604800}
      TZ: Asia/Seoul

  # Swagger UI for docs/openapi.yaml, served by nginx under /docs/.
  docs:
    image: swaggerapi/swagger-ui:v5.33.1
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URL: /openapi.yaml

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      docs:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs/openapi.yaml:/srv/docs/openapi.yaml:ro

  # Temporary public HTTPS address for testing the Android app, which only
  # talks to HTTPS servers. Off by default; start with --profile tunnel. The
  # address is printed in `docker compose logs tunnel` and changes on restart.
  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    profiles: [tunnel]
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    command: tunnel --no-autoupdate --url http://nginx:80

volumes:
  db-data:
